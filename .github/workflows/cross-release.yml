name: Cross Release Example Binary

on:
  push:
    tags:
      - v[0-9]+.*

permissions: {}

jobs:
  build:
    name: Release example binary via Cross
    strategy:
      matrix:
        info:
          - os: "ubuntu-latest"
            target: "aarch64-unknown-linux-gnu"
          - os: "ubuntu-latest"
            target:  "x86_64-unknown-linux-musl"
    runs-on: ${{ matrix.info.os }}
    permissions:
      contents: write # Used to publish releases
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Update Rust toolchain
        run: rustup upgrade
      - name: Setup Cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Example
        shell: bash
        run: cd examples && cross build --release --target ${{ matrix.info.target }}

      - name: Package Example
        shell: bash
        env:
          NAME: unifiedlog_iterator
          TARGET: ${{ matrix.info.target }}
        run: .github/scripts/package.sh

      - name: Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: "unifiedlog_iterator*"
          name: "${{ vars.GITHUB_REF_NAME }} - Released!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}