[package]
name = "logrs"
version = "0.1.0"
edition = "2024"

[dependencies]
time = { version = "0.3.55", default-features = false}
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tracing = "0.1.44"
serde_json = "1.0.154"
macos-unifiedlogs = { path = "../.."}
clap = { version = "4.6.9", features = ["std", "help", "derive"] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.29.3", default-features = false, features = ["v4", "serde"] }
