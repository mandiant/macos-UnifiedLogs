[package]
name = "logrs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tracing = "0.1.44"
serde_json = "1.0.150"
macos-unifiedlogs = { path = "../.."}
clap = { version = "4.6.1", features = ["std", "help", "derive"] }
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.23.4", default-features = false, features = ["v4", "serde"] }
