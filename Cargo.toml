[package]
name = "macos-unifiedlogs"
version = "0.8.0"
edition = "2024"
autotests = false
license = "Apache-2.0"
repository = "https://github.com/mandiant/macos-unifiedlogs"
description = "A library to help parse macOS UnifiedLogs"
keywords = ["forensics", "macOS", "unifiedlog"]
rust-version = "1.88"

[dependencies]
nom = "8.0.0"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
lz4_flex = "0.14.2"
byteorder = "1.5.0"
plist = "1.10.5"
uuid = { version = "1.29.3", default-features = false, features = ["serde"] }
base64 = "0.23.1"
jiff = { version = "1.0.3", default-features = false }
sunlight = "0.3.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
num_enum = "0.7.6"
bitflags = "2.13.2"
elsa = "1.11.2"

[dev-dependencies]
criterion = "0.8.2"
anyhow = "1.0.105"
test-case = "3.4.1"
regex = "1.13.2"

[[bench]]
name = "high_sierra_benchmark"
harness = false

[[bench]]
name = "big_sur_benchmark"
harness = false

[[bench]]
name = "monterey_benchmark"
harness = false

[[test]]
name = "big_sur_tests"
path = "tests/big_sur_tests.rs"

[[test]]
name = "high_sierra_tests"
path = "tests/high_sierra_tests.rs"

[[test]]
name = "monterey_tests"
path = "tests/monterey_tests.rs"

[[test]]
name = "tahoe_tests"
path = "tests/tahoe_tests.rs"

[[test]]
name = "golden_gate_tests"
path = "tests/golden_gate_tests.rs"
